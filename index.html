.logo.hdr-logo{height:46px;width:140px;}
.foot .logo{height:62px;width:190px;margin:0 auto 18px;}

.langs{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:6px;overflow:hidden;flex:none;}
.langs button{background:transparent;border:none;color:#AFC0D2;font-family:var(--f-d);font-weight:700;
  font-size:11.5px;letter-spacing:.06em;padding:9px 9px;cursor:pointer;transition:.15s;min-width:38px;}
.langs button+button{border-left:1px solid rgba(255,255,255,.18);}
.langs button:hover:not(.on){color:#fff;background:rgba(255,255,255,.08);}
.langs button.on{background:var(--blue-bright);color:#fff;}
@media(max-width:430px){
  .hdr{flex-direction:column;align-items:flex-start;}
  .langs{width:100%;}
  .langs button{flex:1;}
}

.claim{font-family:var(--f-d);font-weight:800;font-size:11px;letter-spacing:.09em;color:var(--blue-bright);text-transform:uppercase;margin:18px 0 0;}
.top h1{font-size:clamp(24px,6vw,31px);text-transform:uppercase;line-height:1.07;margin:10px 0 12px;}
.top p{color:#AFC0D2;font-size:15px;margin:0;padding-bottom:38px;}

.wrap{max-width:600px;margin:-22px auto 0;padding:0 20px 70px;}
.card{background:var(--paper);border-radius:10px;box-shadow:0 10px 34px -14px rgba(11,42,74,.3);overflow:hidden;}
.sec{padding:26px 22px;border-bottom:1px solid var(--rule);}
.sec-h{display:flex;align-items:baseline;gap:11px;margin-bottom:20px;}
.sec-n{font-family:var(--f-d);font-weight:800;font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:3px 8px;flex:none;}
.sec-h h2{font-size:15px;}
.sec-note{font-size:13px;color:var(--stone);margin:-12px 0 16px;}

.f{margin-bottom:18px;}
.f:last-child{margin-bottom:0;}
.f>label,.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;}
.om{font-weight:400;color:var(--stone);font-size:12.5px;}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{
  width:100%;padding:13px 14px;font-family:var(--f-b);font-size:16px;
  border:1.5px solid #C6D0DA;border-radius:6px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235D6E80' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,235,.13);}
input.bad{border-color:var(--err);}
.errmsg{display:none;font-size:12.5px;color:var(--err);margin-top:5px;font-weight:500;}
.errmsg.on{display:block;}
textarea{min-height:76px;resize:vertical;}
.hint{font-size:12.5px;color:var(--stone);margin-top:6px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.telrow{display:grid;grid-template-columns:118px 1fr;gap:10px;}
.telrow select{padding:13px 10px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;}}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:11px 14px;
  border:1.5px solid #C6D0DA;border-radius:22px;font-size:14.5px;background:#fff;transition:.15s;min-height:44px;}
.chips input{accent-color:var(--blue);margin:0;width:17px;height:17px;}
.chips label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);font-weight:600;}

.cb{position:relative;}
.cb-in{width:100%;padding:13px 40px 13px 14px;font-size:16px;border:1.5px solid #C6D0DA;border-radius:6px;background:#fff;}
.cb-ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--stone);}
.cb-pop{position:absolute;z-index:60;top:calc(100% + 5px);left:0;right:0;background:#fff;
  border:1.5px solid var(--blue-line);border-radius:8px;box-shadow:0 14px 32px -10px rgba(11,31,51,.3);
  max-height:290px;overflow-y:auto;display:none;}
.cb-pop.on{display:block;}
.cb-grp{font-family:var(--f-d);font-weight:800;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--stone);padding:12px 14px 5px;background:#F7F9FB;position:sticky;top:0;}
.cb-opt{padding:12px 14px;font-size:15.5px;cursor:pointer;border-top:1px solid #F0F4F7;}
.cb-opt:hover,.cb-opt.hi{background:var(--blue-soft);}
.cb-empty{padding:16px 14px;font-size:14px;color:var(--stone);}
.cb-sel{display:none;align-items:center;gap:9px;margin-top:9px;padding:11px 13px;background:var(--blue-soft);
  border:1.5px solid var(--blue-line);border-radius:6px;font-size:15px;font-weight:600;}
.cb-sel.on{display:flex;}
.cb-sel button{margin-left:auto;background:none;border:none;color:var(--stone);cursor:pointer;font-size:17px;padding:0 4px;}

.odv{border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;}
.odv-r{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--rule);background:#fff;}
.odv-r:last-child{border-bottom:none;}
.odv-r.on{background:var(--blue-soft);}
.odv-r>label{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin:0;font-weight:400;}
.odv-r input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px;flex:none;}
.odv-r input[type=number]{padding:9px 10px;font-size:16px;text-align:center;}
.odv-r input[type=number]:disabled{background:#F4F7FA;border-color:#E2E8EE;color:#B6C1CC;}

.jz{display:grid;grid-template-columns:1fr 152px;gap:10px;margin-bottom:10px;align-items:center;}
.jz.extra{grid-template-columns:1fr 152px 46px;}
.jz .nm{font-size:15px;font-weight:600;}
.jz select{padding:11px 12px;font-size:16px;}
.addbtn{width:100%;padding:12px;margin-top:4px;background:var(--blue-soft);border:1.5px dashed var(--blue-line);
  border-radius:6px;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer;}
.xbtn{background:#fff;border:1.5px solid #C6D0DA;border-radius:6px;color:var(--stone);cursor:pointer;font-size:16px;height:46px;}

.cond{display:none;margin-top:12px;padding:14px;background:#F7F9FB;border-left:3px solid var(--blue);border-radius:0 6px 6px 0;}
.cond.on{display:block;}
.cond .lbl{font-size:13px;margin-bottom:7px;}

.gdpr{background:#F7F9FB;padding:24px 22px;}
.pr{background:#fff;border:1.5px solid var(--rule);border-radius:8px;padding:13px;margin-bottom:10px;}
.pr.bad{border-color:var(--err);}
.pr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:var(--f-d);font-weight:800;font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;}
.pr-h .xbtn{height:34px;width:38px;font-size:14px;}
.pr .f{margin-bottom:12px;}
.pr textarea{min-height:60px;}
.pr input.bad{border-color:var(--err);}
.dodnes{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-top:7px;cursor:pointer;}
.dodnes input{accent-color:var(--blue);width:17px;height:17px;margin:0;}
.pr input[type=number]:disabled{background:#F4F7FA;color:#B6C1CC;}
.gd{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;font-size:13.5px;color:#33465C;line-height:1.55;}
.gd:last-child{margin-bottom:0;}
.gd input{accent-color:var(--blue);width:19px;height:19px;margin-top:2px;flex:none;}
.gd a{color:var(--blue);}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-left:5px;vertical-align:1px;}
.tag.req{background:#FDEAE7;color:var(--err);}
.tag.vol{background:#E8F5EC;color:var(--ok);}

.submit-wrap{padding:22px;}
.send{width:100%;padding:17px;background:var(--blue);color:#fff;border:none;border-radius:7px;
  font-family:var(--f-d);font-size:15px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
.send:hover{background:var(--blue-bright);}
.form-err{display:none;margin-top:12px;padding:12px 14px;background:#FDEAE7;border-left:3px solid var(--err);
  border-radius:0 5px 5px 0;font-size:13.5px;color:#8E2A1E;}
.form-err.on{display:block;}

.done{display:none;padding:44px 24px;text-align:center;}
.done.on{display:block;}
.done .tick{width:60px;height:60px;border-radius:50%;background:#E8F5EC;color:var(--ok);
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;}

/* ---------- prepinac ---------- */
LANGS.forEach(code => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = LANG_LABEL[code]; b.dataset.l = code;
  b.addEventListener("click", () => prepni(code));
  $("langs").appendChild(b);
});
function prepni(code){
  L = code;
  document.documentElement.lang = code;
  const lf = $("formLang");
  if (lf) lf.value = code;
  [...$("langs").children].forEach(b => b.classList.toggle("on", b.dataset.l === code));
  vykresliVsetko();
}

/* ---------- vykreslenie ---------- */
function chipSkupina(box, zoznam, meno, typ){
  const zvolene = [...box.querySelectorAll("input:checked")].map(i => i.value);
  box.innerHTML = "";
  zoznam.forEach(item => {
    const l = document.createElement("label");
    const inp = document.createElement("input");
    inp.type = typ; inp.name = meno; inp.value = val(item);
    if (zvolene.includes(val(item))) inp.checked = true;
    l.appendChild(inp);
    l.appendChild(document.createTextNode(t(item)));
    box.appendChild(l);
  });
}

function vykresliVsetko(){
  document.querySelectorAll("[data-t]").forEach(el => {
    const k = el.dataset.t;
    if (T[k]) el.textContent = t(T[k]);
  });
  document.querySelectorAll("[data-tph]").forEach(el => {
    const k = el.dataset.tph;
    if (T[k]) el.placeholder = t(T[k]);
  });
  if (typeof cislujPrace === "function") cislujPrace();
  $("cbIn").placeholder = t(T.poz_ph);
  $("praxP").placeholder = t(T.roky_ph);

  vykresliPredvolby();
  chipSkupina($("pohl"), POHLAVIE, "Geschlecht", "radio");
  chipSkupina($("dost"), DOSTUPNOST, "dostRadio", "radio");
  chipSkupina($("karta"), ANO_NIE, "Fahrerkarte", "radio");
  // pri volbe "k urcitemu datumu" sa odomkne kalendar
  $("dost").querySelectorAll("input").forEach(i => i.addEventListener("change", obnovDatum));
  obnovDatum();
  vykresliVodicak();
  vykresliKurzy();
  vykresliOdvetvia();
  vykresliJazyky();

  const sel = $("vzd"), predch = sel.value;
  sel.innerHTML = '<option value="">' + t(T.vyberte) + '</option>';
  VZDELANIE.forEach(v => {
    const o = document.createElement("option");
    o.value = val(v); o.textContent = t(v);
    if (val(v) === predch) o.selected = true;
    sel.appendChild(o);
  });

  const pv = $("poziciaVal").value;
  if (pv){
    for (const par of POZICIE){
      const najdene = par[1].find(p => val(p) === pv);
      if (najdene){ $("cbSelTxt").textContent = t(najdene); break; }
    }
  }
  $("dn").max = new Date().toISOString().slice(0,10);
  $("zrusPozBtn").setAttribute("aria-label", t(T.odstranit));
  prepocitaj();
}

function vykresliPredvolby(){
  const sel = $("telPred");
  const predch = sel.value;
  sel.innerHTML = "";
  PREDVOLBY.forEach(p => {
    const o = document.createElement("option");
    o.value = p.kod;
    o.textContent = p.kod === "__INE__" ? t(T.pred_ine) : p.kod + "  " + p.stat;
    sel.appendChild(o);
  });
  sel.value = predch || PRED_PODLA_JAZYKA[L] || "+421";
  obnovTelPole();
}

function aktivnaPredvolba(){
  return PREDVOLBY.find(p => p.kod === $("telPred").value) || PREDVOLBY[0];
}

function obnovTelPole(){
  const p = aktivnaPredvolba();
  const ine = p.kod === "__INE__";
  $("telNum").placeholder = ine ? "+00 000 000 000" : "9".repeat(p.min);
  $("telNum").maxLength = ine ? 16 : p.max + 4;
  skladajTelefon();
}

// skryte pole "Telefon" = predvolba + cislo, aby v maili bolo cele cislo
function skladajTelefon(){
  const p = aktivnaPredvolba();
  const cislice = $("telNum").value.replace(/\D/g, "").replace(/^0+/, "");
  $("tel").value = cislice ? (p.kod === "__INE__" ? "+" + cislice : p.kod + " " + cislice) : "";
}

function vykresliVodicak(){
  const box = $("vp");
  const zvolene = [...box.querySelectorAll("input:checked")].map(i => i.value);
  box.innerHTML = "";
  VODICAK.forEach(sk => {
    const l = document.createElement("label");
    const inp = document.createElement("input");
    inp.type = "checkbox"; inp.name = "Fuehrerschein"; inp.value = val(sk);
    if (zvolene.includes(val(sk))) inp.checked = true;
    inp.addEventListener("change", () => {
      if (val(sk) === "Keiner" && inp.checked){
        box.querySelectorAll("input").forEach(i => { if (i !== inp) i.checked = false; });
      } else if (inp.checked){
        const z = [...box.querySelectorAll("input")].find(i => i.value === "Keiner");
        if (z) z.checked = false;
      }
      obnovKartu();
      prepocitaj();
    });
    l.appendChild(inp);
    l.appendChild(document.createTextNode(t(sk)));
    box.appendChild(l);
  });
  obnovKartu();
}
function obnovDatum(){
  const zvolena = $("dost").querySelector("input:checked");
  const jeDatum = !!zvolena && zvolena.value === "Ab bestimmtem Datum";
  $("c-dostdatum").classList.toggle("on", jeDatum);
  if (!jeDatum) $("dostDatum").value = "";
  // nastup v minulosti nedava zmysel
  $("dostDatum").min = new Date().toISOString().slice(0,10);
  prepocitaj();
}

function obnovKartu(){
  const profi = [...$("vp").querySelectorAll("input:checked")].some(i => ["C","CE","D"].includes(i.value));
  $("c-karta").classList.toggle("on", profi);

  if (!profi) $("c-karta").querySelectorAll("input:checked").forEach(i => i.checked = false);

function vykresliKurzy(){
  const box = $("kurzy");
  // porovnavame podla zakladu, nie podla .value — .value moze byt po zlyhanom
  // odoslani zmutovana na "Schweißerpass (135)" a nezhodovala by sa
  const zvolene = [...box.querySelectorAll("input:checked")].map(i => i.dataset.zaklad || i.value);
  box.innerHTML = "";
  KURZY.forEach(par => {
    const nazov = par[0], condId = par[1];
    const l = document.createElement("label");
    const inp = document.createElement("input");
    inp.type = "checkbox"; inp.name = "Zertifikate"; inp.value = val(nazov);
    inp.dataset.zaklad = val(nazov);
    if (condId) inp.dataset.cond = condId;
    if (zvolene.includes(val(nazov))) inp.checked = true;

      if (condId) $(condId).classList.toggle("on", inp.checked);
      prepocitaj();
    });
    l.appendChild(inp);
    l.appendChild(document.createTextNode(t(nazov)));
    box.appendChild(l);
    if (condId) $(condId).classList.toggle("on", inp.checked);
  });
}

function vykresliOdvetvia(){
  const box = $("odv");
  const stav = [...box.querySelectorAll(".odv-r")].map(r => ({
    z: r.querySelector("input[type=checkbox]").checked,
    roky: r.querySelector("input[type=number]").value
  }));
  box.innerHTML = "";
  ODVETVIA.forEach((nazov, i) => {
    const r = document.createElement("div");
    r.className = "odv-r";
    const lab = document.createElement("label");
    const chk = document.createElement("input");
    chk.type = "checkbox"; chk.value = val(nazov);
    lab.appendChild(chk);
    lab.appendChild(document.createTextNode(t(nazov)));
    const num = document.createElement("input");
    num.type = "number";
    num.min = 0; num.max = 60; num.inputMode = "numeric";
    num.placeholder = t(T.roky_ph); num.disabled = true;
    if (stav[i]){
      chk.checked = stav[i].z;
      num.disabled = !stav[i].z;
      num.value = stav[i].roky;
      r.classList.toggle("on", stav[i].z);
    }
    chk.addEventListener("change", () => {
      num.disabled = !chk.checked;
      r.classList.toggle("on", chk.checked);
      if (!chk.checked) num.value = ""; else num.focus();
      prepocitaj();
    });
    r.appendChild(lab); r.appendChild(num);
    box.appendChild(r);
  });
}

function urovneOptions(zvolena){
  return UROVNE.map(u =>
    '<option value="'+val(u)+'"'+(val(u)===zvolena?' selected':'')+'>'+t(u)+'</option>').join("");
}

function vykresliJazyky(){
  const box = $("jaz");
  const stav = [...box.querySelectorAll(".jz")].map(r => {
    if (!r.classList.contains("extra")) return { extra:false, nazov:null, uroven:r.querySelector("select").value };
    const sel = r.querySelector(".jaz-nazov"), vlastny = r.querySelector(".jaz-vlastny");
    const nazov = sel.value === "__INE__" ? vlastny.value : sel.value;
    return { extra:true, nazov: nazov, uroven: r.querySelector(".jaz-uroven").value };
  });
  box.innerHTML = ""; jazN = 0;
  if (!stav.length){
    JAZ_PEVNE.forEach(j => riadokJazyka(j, true, "Keine"));
  } else {
    let pevnyIdx = 0;
    stav.forEach(s => {
      if (s.extra) riadokJazyka(null, false, s.uroven, s.nazov);
      else riadokJazyka(JAZ_PEVNE[pevnyIdx++], true, s.uroven);
    });
  }
}

function riadokJazyka(jazyk, pevny, uroven, nazovText){
  jazN++;
  const id = "jz"+jazN;
  const row = document.createElement("div");
  row.className = "jz" + (pevny ? "" : " extra");
  row.id = id;
  if (pevny){
    row.innerHTML = '<span class="nm">'+t(jazyk)+'</span>' +
      '<select name="Sprache_'+val(jazyk)+'">'+urovneOptions(uroven)+'</select>';
  } else {
    // vyber jazyka s nemeckymi hodnotami; posledna moznost odomkne volny text
    const opts = '<option value="">'+t(T.vyberte)+'</option>' +
      JAZ_DALSIE.map(j => '<option value="'+val(j)+'">'+t(j)+'</option>').join("");
    row.innerHTML =
      '<select class="jaz-nazov">'+opts+'</select>' +
      '<select class="jaz-uroven">'+urovneOptions(uroven)+'</select>' +
      '<button type="button" class="xbtn" aria-label="'+t(T.odstranit)+'">✕</button>' +
      '<input type="text" class="jaz-vlastny" style="display:none;grid-column:1/-1;margin-top:8px">';
    const selNazov  = row.querySelector(".jaz-nazov");
    const volnyText = row.querySelector(".jaz-vlastny");
    volnyText.placeholder = t(T.jaz_ph);
    // obnova stavu po prepnuti jazyka: bud je to znama polozka, alebo vlastny text
    if (nazovText){
      const znamy = JAZ_DALSIE.find(j => val(j) === nazovText);
      if (znamy){ selNazov.value = nazovText; }
      else { selNazov.value = "__INE__"; volnyText.style.display = ""; volnyText.value = nazovText; }
    }
    selNazov.addEventListener("change", () => {
      const ine = selNazov.value === "__INE__";
      volnyText.style.display = ine ? "" : "none";
      if (!ine) volnyText.value = ""; else volnyText.focus();
      prepocitaj();
    });
    row.querySelector(".xbtn").addEventListener("click", () => { row.remove(); prepocitaj(); });
  }
  row.querySelectorAll("select,input").forEach(el => el.addEventListener("change", prepocitaj));
  $("jaz").appendChild(row);
}
function pridajJazyk(){ riadokJazyka(null, false, "Keine"); }

/* ---------- combobox ---------- */
const cbIn = $("cbIn"), cbPop = $("cbPop"), cbSel = $("cbSel");
let hiIdx = -1;

function vykresliPop(filter){
  const q = norm(filter.trim());
  cbPop.innerHTML = "";
  let pocet = 0;
  POZICIE.forEach(par => {
    const skupina = par[0], polozky = par[1];
    // hlada sa vo vsetkych jazykovych variantoch naraz — kandidat najde
    // poziciu aj ked ju napise po svojom (napr. "kelner" v SK rezime)
    const zhody = polozky.filter(p => !q || p.some(variant => norm(variant).includes(q)));
    if (!zhody.length) return;
    const gh = document.createElement("div");
    gh.className = "cb-grp"; gh.textContent = t(skupina);
    cbPop.appendChild(gh);
    zhody.forEach(p => {
      const o = document.createElement("div");
      o.className = "cb-opt"; o.setAttribute("role","option");
      o.textContent = t(p); o.dataset.v = val(p);
      o.addEventListener("mousedown", e => { e.preventDefault(); vyberPoziciu(val(p), t(p)); });
      cbPop.appendChild(o); pocet++;
    });
  });
  if (!pocet) cbPop.innerHTML = '<div class="cb-empty">'+t(T.nenajdene)+'</div>';
  hiIdx = -1;
}
function otvorPop(){ cbPop.classList.add("on"); cbIn.setAttribute("aria-expanded","true"); }
function zavriPop(){ cbPop.classList.remove("on"); cbIn.setAttribute("aria-expanded","false"); }
function vyberPoziciu(hodnotaDE, popis){
  $("poziciaVal").value = hodnotaDE;
  $("cbSelTxt").textContent = popis;
  cbSel.classList.add("on");
  cbIn.value = ""; cbIn.style.display = "none";
  document.querySelector(".cb-ic").style.display = "none";
  zavriPop(); $("e-poz").classList.remove("on");
  prepocitaj();
}
function zrusPoziciu(){
  $("poziciaVal").value = "";
  cbSel.classList.remove("on");
  cbIn.style.display = ""; document.querySelector(".cb-ic").style.display = "";
  cbIn.focus(); prepocitaj();
}
cbIn.addEventListener("focus", () => { vykresliPop(cbIn.value); otvorPop(); });
cbIn.addEventListener("input", () => { vykresliPop(cbIn.value); otvorPop(); });
cbIn.addEventListener("blur", () => setTimeout(zavriPop, 120));
cbIn.addEventListener("keydown", e => {
  const opts = [...cbPop.querySelectorAll(".cb-opt")];
  if (!opts.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    hiIdx += (e.key === "ArrowDown" ? 1 : -1);
    if (hiIdx < 0) hiIdx = opts.length-1;
    if (hiIdx >= opts.length) hiIdx = 0;
    opts.forEach(o => o.classList.remove("hi"));
    opts[hiIdx].classList.add("hi");
    if (opts[hiIdx].scrollIntoView) opts[hiIdx].scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter" && hiIdx >= 0){
    e.preventDefault();
    vyberPoziciu(opts[hiIdx].dataset.v, opts[hiIdx].textContent);
  } else if (e.key === "Escape") zavriPop();
});

const SLED = ["telNum","mail","dn","mesto","praxP","vzd","odbor","cv","kurzIne"];
function prepocitaj(){
  let hot = 0, spolu = 0;
  SLED.forEach(id => { const el = $(id); if (!el) return; spolu++; if (el.value) hot++; });
  spolu++; if ($("poziciaVal").value) hot++;
  spolu++; if ($("meno").value) hot++;
  ["Geschlecht","dostRadio"].forEach(n => { spolu++; if (document.querySelector('input[name="'+n+'"]:checked')) hot++; });
  ["Zertifikate","Fuehrerschein"].forEach(n => { spolu++; if (document.querySelector('input[name="'+n+'"]:checked')) hot++; });
  spolu++; if (document.querySelector('#odv input[type=checkbox]:checked')) hot++;
  spolu++; if ([...document.querySelectorAll('#jaz .jz select:not(.jaz-nazov)')].some(s => s.value !== "Keine" && s.value !== "")) hot++;
  spolu++; if ($("s1").checked) hot++;
  $("progBar").style.width = Math.round(hot/spolu*100) + "%";
}

// Odstrani z formulara vsetky prazdne polia pred odoslanim — inak Netlify
// posle mail so vsetkymi deklarovanymi polami vratane tych nevyplnenych
// (napr. "Jahre Bauwesen:" bez hodnoty, ked odvetvie vobec nie je zaskrtnute).
function ocistiPrazdnePolia(fd){
  const cista = new FormData();
  for (const [kluc, hodnota] of fd.entries()){
    // honeypot musi ist vzdy, aj prazdny — Netlify podla neho rozpoznava boty
    if (kluc === "bot-field"){ cista.append(kluc, hodnota); continue; }
    if (hodnota instanceof File){
      if (hodnota.size > 0) cista.append(kluc, hodnota);
    } else if (String(hodnota).trim() !== ""){
      cista.append(kluc, hodnota);
    }
  }
  return cista;
}

/* Skladá pred odoslaním niekoľko uzkych poli do jedneho zhrnujuceho textu.
   Dovod: Netlify v maili zobrazuje VSETKY polia deklarovane v skrytom
   formulari pri nasadeni, aj ked konkretna prihlaska dane pole vobec
   neposlala (prazdne). Pri 11 samostatnych poliach "roky v odvetvi"
   to znamenalo 8-10 prazdnych riadkov v kazdom maile. Riesenie: namiesto
   mnohych deklarovanych poli, z ktorych je vzdy vyplnene len jedno-dve,
   sa pouzije jedno pole s hotovym textom. */
function pripravKonsolidovanePolia(){
  // 1) odvetvia + roky -> jeden text
  const odvetviaText = [...document.querySelectorAll("#odv .odv-r")]
    .map(r => {
      const chk = r.querySelector("input[type=checkbox]");
      const num = r.querySelector("input[type=number]");
      if (!chk.checked) return null;
      const roky = num.value.trim();
      return chk.value + (roky ? " (" + roky + " Jahre)" : "");
    })
    .filter(Boolean)
    .join(", ");

  // 2) dalsie jazyky -> jeden text, nazvy po nemecky
  const dalsieJazyky = [...document.querySelectorAll("#jaz .jz.extra")]
    .map(r => {
      const sel = r.querySelector(".jaz-nazov");
      const vlastny = r.querySelector(".jaz-vlastny");
      const nazov = (sel.value === "__INE__" ? vlastny.value.trim() : sel.value);
      const uroven = r.querySelector(".jaz-uroven").value;
      return nazov ? nazov + ": " + uroven : null;
    })
    .filter(Boolean)
    .join(", ");

  // 3) zvaracie metody / rozsah elektro -> priamo do nazvu certifikatu
  document.querySelectorAll("#kurzy input[type=checkbox]").forEach(chk => {
    if (!chk.dataset.cond) return;
    const detailInput = document.querySelector("#" + chk.dataset.cond + " input");
    const detail = chk.checked && detailInput ? detailInput.value.trim() : "";
    chk.value = detail ? chk.dataset.zaklad + " (" + detail + ")" : chk.dataset.zaklad;
  });

  // 5) dostupnost: pri volbe "k urcitemu datumu" sa posle konkretny datum
  const dostSel = $("dost").querySelector("input:checked");
  let dostupnost = dostSel ? dostSel.value : "";
  if (dostupnost === "Ab bestimmtem Datum"){
    const dd = $("dostDatum").value;
    dostupnost = dd ? "Ab " + dd : "Nach Vereinbarung";
  }
  $("dostOut").value = dostupnost;

  /* 6) VSETKO NEPOVINNE -> jedno pole "Details".
        Netlify v maili vypise kazde deklarovane pole, aj ked je prazdne.
        Preto je v deklaracii len par vzdy vyplnenych poli + tento suhrn,
        do ktoreho ide iba to, co kandidat naozaj vyplnil. */
  const riadky = [];
  const pridaj = (popis, hodnota) => { if (hodnota && String(hodnota).trim()) riadky.push(popis + ": " + hodnota); };

  const zaskrtnute = n => [...document.querySelectorAll('input[name="'+n+'"]:checked')].map(i => i.value).join(", ");
  const vekText = () => {
    const d = $("dn").value; if (!d) return "";
    const n = new Date(d), t = new Date();
    let v = t.getFullYear() - n.getFullYear();
    const m = t.getMonth() - n.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < n.getDate())) v--;
    return (v >= 14 && v <= 100) ? d + " (" + v + " J.)" : d;
  };

  pridaj("E-Mail", $("mail").value.trim());
  pridaj("Geburtsdatum", vekText());
  pridaj("Ort", $("mesto").value.trim());
  pridaj("Geschlecht", zaskrtnute("Geschlecht"));
  pridaj("Berufsjahre in der Position", $("praxP").value.trim());
  if ($("ajIne").checked) riadky.push("Auch an anderen Positionen interessiert: ja");
  if (!bezCV()) pridaj("Branchenerfahrung", odvetviaText);

  const jazyky = [];
  const de = document.querySelector('[name="Sprache_Deutsch"]');
  const en = document.querySelector('[name="Sprache_Englisch"]');
  if (de && de.value !== "Keine") jazyky.push("Deutsch: " + de.value);
  if (en && en.value !== "Keine") jazyky.push("Englisch: " + en.value);
  if (dalsieJazyky) jazyky.push(dalsieJazyky);
  pridaj("Sprachen", jazyky.join(", "));

  pridaj("Ausbildung", $("vzd").value + ($("odbor").value.trim() ? " — " + $("odbor").value.trim() : ""));
  pridaj("Zertifikate", zaskrtnute("Zertifikate"));
  pridaj("Weitere Zertifikate", $("kurzIne").value.trim());

  const vp = zaskrtnute("Fuehrerschein");
  const karta = zaskrtnute("Fahrerkarte");
  pridaj("Führerschein", vp + (karta ? " | Fahrerkarte: " + karta : ""));

  pridajPrace(riadky);
  if ($("s2").checked) riadky.push("Einwilligung Datenbank (3 Jahre): ja");
  riadky.push("Formularsprache: " + L);

  $("detailsOut").value = riadky.join("\n");
}

$("frm").addEventListener("submit", e => {
  e.preventDefault();
  const chyby = [];
  if (chybne($("meno"),"e-meno", () => !$("meno").value.trim())) chyby.push(t(T.f_meno));
  if (chybne($("telNum"),"e-tel", zlyTel))  chyby.push(t(T.f_tel));
  if (chybne($("mail"),"e-mail", zlyMail)) chyby.push(t(T.f_mail));
  if (!$("poziciaVal").value){ $("e-poz").classList.add("on"); chyby.push(t(T.f_poz)); }
  const dostZvolena = $("dost").querySelector("input:checked");
  const dostChyba = !dostZvolena || (dostZvolena.value === "Ab bestimmtem Datum" && !$("dostDatum").value);
  $("e-dost").classList.toggle("on", dostChyba);
  if (dostChyba) chyby.push(t(T.f_dost));
  if (!$("s1").checked) chyby.push(t(T.err_suhlas));
  if (velkeCV()) chyby.push(t(T.cv_velke));
  if (zlePrace()) chyby.push(t(T.prace_kr));

  const box = $("formErr");
  if (chyby.length){
    box.textContent = t(T.doplnte) + chyby.join(", ") + ".";
    box.classList.add("on");
    const prve = document.querySelector(".bad, .errmsg.on");
    if (prve && prve.scrollIntoView) prve.scrollIntoView({block:"center"});
    return;
  }
  box.classList.remove("on");

  pripravKonsolidovanePolia();

  const tlacidlo = $("frm").querySelector(".send");
  tlacidlo.disabled = true;
  tlacidlo.textContent = t(T.odosielam);

  let data = new FormData($("frm"));
  data.set("Formularsprache", L);
  data = ocistiPrazdnePolia(data);

  fetch("/", { method: "POST", body: data })
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      $("frm").style.display = "none";
      $("done").classList.add("on");
      window.scrollTo({top:0, behavior:"smooth"});
    })
    .catch(err => {
      console.error("Odoslanie zlyhalo:", err);
      tlacidlo.disabled = false;
      tlacidlo.textContent = t(T.btn);
      box.textContent = t(T.chyba_odoslania);
      box.classList.add("on");
    });
});

e_roky:["Bitte Jahre prüfen: nicht in der Zukunft, „bis“ nicht vor „von“.","Skontrolujte roky: nie v budúcnosti, „do“ nie skôr ako „od“.","Zkontrolujte roky: ne v budoucnosti, „do“ ne dříve než „od“.","Sprawdź lata: nie w przyszłości, „do“ nie wcześniej niż „od“.","Please check the years: not in the future, “to” not before “from”."],
e_prace0:["Bitte mindestens eine Stelle eintragen oder „noch nirgends gearbeitet“ ankreuzen.","Vyplňte aspoň jednu prácu alebo zaškrtnite „Zatiaľ som nikde nepracoval“.","Vyplňte alespoň jednu práci nebo zaškrtněte „Zatím jsem nikde nepracoval“.","Wpisz co najmniej jedną pracę lub zaznacz „Jeszcze nigdzie nie pracowałem“.","Add at least one job or tick “I haven't worked anywhere yet”."]
});
const MAX_PRAC = 3;
const bezCV = () => $("bezCV").checked;

function cislujPrace(){
  const rows = [...document.querySelectorAll("#prace .pr")];
  rows.forEach((r,i) => {
    r.querySelector(".pr-n").textContent = t(T.p_n) + " " + (i+1);
    r.querySelector(".xbtn").style.visibility = rows.length > 1 ? "visible" : "hidden";
    r.querySelector(".xbtn").setAttribute("aria-label", t(T.odstranit));
  });
  $("pridajPracu").style.display = rows.length >= MAX_PRAC ? "none" : "";
}

function pridajPracu(){
  if (document.querySelectorAll("#prace .pr").length >= MAX_PRAC) return;
  const r = document.createElement("div");
  r.className = "pr";
  r.innerHTML =
    '<div class="pr-h"><span class="pr-n"></span><button type="button" class="xbtn">✕</button></div>' +
    '<div class="f"><label data-t="p_firma"></label><input type="text" class="p-firma" data-tph="p_firma_ph"></div>' +
    '<div class="f"><label data-t="p_poz"></label><input type="text" class="p-poz" data-tph="p_poz_ph"></div>' +
    '<div class="row2">' +
      '<div class="f"><label data-t="p_od"></label><input type="number" class="p-od" inputmode="numeric" min="1960" placeholder="2019"></div>' +
      '<div class="f"><label data-t="p_do"></label><input type="number" class="p-do" inputmode="numeric" min="1960" placeholder="2023">' +
        '<label class="dodnes"><input type="checkbox" class="p-dodnes"><span data-t="p_dodnes"></span></label></div>' +
    '</div>' +
    '<div class="f" style="margin-bottom:0"><label><span data-t="p_co"></span> <span class="om" data-t="opt"></span></label><textarea class="p-co" data-tph="p_co_ph"></textarea></div>';
  r.querySelectorAll("[data-t]").forEach(el => el.textContent = t(T[el.dataset.t]));
  r.querySelectorAll("[data-tph]").forEach(el => el.placeholder = t(T[el.dataset.tph]));
  const dodnes = r.querySelector(".p-dodnes"), doIn = r.querySelector(".p-do");
  dodnes.addEventListener("change", () => { doIn.disabled = dodnes.checked; doIn.placeholder = dodnes.checked ? "" : "2023"; if (dodnes.checked) doIn.value = ""; });
  r.querySelector(".xbtn").addEventListener("click", () => { r.remove(); cislujPrace(); });
  $("prace").appendChild(r);
  cislujPrace();
  return r;
}

function obnovBezCV(){
  const on = bezCV();
  $("c-prace").classList.toggle("on", on);
  $("cvPole").style.display = on ? "none" : "";
  if (on) $("cv").value = "";
  // odvetvia s rokmi su pri vyplnenych zamestnaniach zbytocne
  $("sec3").style.display = on ? "none" : "";
  let n = 0;
  document.querySelectorAll(".sec").forEach(sec => { if (sec.style.display !== "none") sec.querySelector(".sec-n").textContent = ++n; });
  if (on && !document.querySelectorAll("#prace .pr").length) pridajPracu();
  obnovNikde();
}
function obnovNikde(){
  const nik = $("nikde").checked;
  $("prace").style.display = nik ? "none" : "";
  $("pridajPracu").style.display = nik ? "none" : "";
  if (!nik) cislujPrace();
}
$("bezCV").addEventListener("change", obnovBezCV);
$("nikde").addEventListener("change", obnovNikde);
$("pridajPracu").addEventListener("click", () => { const r = pridajPracu(); if (r) r.querySelector(".p-firma").focus(); });

function zlePrace(){
  const box = $("e-prace");
  box.classList.remove("on");
  if (!bezCV() || $("nikde").checked) return false;
  const rows = [...document.querySelectorAll("#prace .pr")];
  if (!rows.length){ box.textContent = t(T.e_prace0); box.classList.add("on"); return true; }
  const Y = new Date().getFullYear();
  let chybaPolia = false, chybaRoky = false;
  rows.forEach(r => {
    const f = r.querySelector(".p-firma"), p = r.querySelector(".p-poz"), od = r.querySelector(".p-od"), dd = r.querySelector(".p-do"), dn = r.querySelector(".p-dodnes").checked;
    const o = parseInt(od.value, 10), d = parseInt(dd.value, 10);
    const prazdne = !f.value.trim() || !p.value.trim() || !od.value || (!dd.value && !dn);
    const zleOd = !!od.value && (isNaN(o) || o < 1960 || o > Y);
    const zleDo = !!dd.value && (isNaN(d) || d < 1960 || d > Y || (!isNaN(o) && d < o));
    f.classList.toggle("bad", !f.value.trim()); p.classList.toggle("bad", !p.value.trim());
    od.classList.toggle("bad", !od.value || zleOd); dd.classList.toggle("bad", (!dd.value && !dn) || zleDo);
    r.classList.toggle("bad", prazdne || zleOd || zleDo);
    if (prazdne) chybaPolia = true;
    if (zleOd || zleDo) chybaRoky = true;
  });
  if (chybaPolia || chybaRoky){ box.textContent = t(chybaRoky && !chybaPolia ? T.e_roky : T.e_prace); box.classList.add("on"); return true; }
  return false;
}
document.addEventListener("input", e => { if (e.target.closest && e.target.closest("#prace") && $("e-prace").classList.contains("on")) zlePrace(); });

function pridajPrace(riadky){
  if (!bezCV()) return;
  riadky.push("Lebenslauf: keiner vorhanden — Angaben aus dem Formular");
  if ($("nikde").checked){ riadky.push("Berufserfahrung: bisher keine"); return; }
  const zoznam = [...document.querySelectorAll("#prace .pr")].map((r,i) => {
    const g = c => r.querySelector(c).value.trim();
    const bis = r.querySelector(".p-dodnes").checked ? "heute" : g(".p-do");
    const co = g(".p-co");
    return "  " + (i+1) + ". " + g(".p-poz") + " – " + g(".p-firma") + ", " + g(".p-od") + "–" + bis + (co ? ": " + co : "");
  });
  riadky.push("Berufserfahrung:\n" + zoznam.join("\n"));
}
